{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Select Pilot</h4>
            </div>
            <div class="card-body">
                <div class="list-group">
                    {% for name, data in pilots.items() %}
                        <div class="list-group-item d-flex justify-content-between align-items-center {% if name == active_pilot %}active{% endif %}">
                            <div>
                                <h5 class="mb-1">{{ name }}</h5>
                                <small>Location: {{ data.current_location }} (Home: {{ data.home_location }})</small>
                            </div>
                            <div class="btn-group" role="group">
                                <a href="{{ url_for('select_pilot', name=name) }}" class="btn btn-sm btn-outline-primary">
                                    Select
                                </a>
                                <a href="{{ url_for('transfer_pilot', pilot_name=name) }}" class="btn btn-sm btn-outline-info">
                                    Transfer
                                </a>
                                {% if name == active_pilot %}
                                    <span class="badge bg-light text-primary rounded-pill ms-2">Active</span>
                                {% endif %}
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
